name: Nightly APK build

on:
  schedule:
    # 02:30 UTC nightly
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly-apk
  cancel-in-progress: false

jobs:
  check:
    name: Check for changes since last run
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      # The signing key is kept in repository secrets; see "Nightly builds" in README.md.
      - name: Check for the signing key
        env:
          NIGHTLY_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
          NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$NIGHTLY_KEYSTORE_BASE64" ] || [ -z "$NIGHTLY_KEYSTORE_PASSWORD" ]; then
            echo "::error::The secrets NIGHTLY_KEYSTORE_BASE64 and NIGHTLY_KEYSTORE_PASSWORD are not set; see \"Nightly builds\" in README.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to build and compute tag
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          date_tag="nightly-$(date -u +%F)"

          # SHA of the last successful run of this workflow (scheduled or manual).
          last_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)

          if [ -n "$last_sha" ] && [ "$last_sha" = "$GITHUB_SHA" ]; then
            echo "No changes since last successful run ($last_sha) — skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual runs are suffixed with X<n>, where n counts the manual
            # releases already made today: nightly-2026-07-25-X1, -X2, ...
            count=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq "[.[].tag_name | select(startswith(\"${date_tag}-X\"))] | length")
            tag="${date_tag}-X$((count + 1))"
          else
            tag="$date_tag"
          fi

          echo "Building ${tag} at ${GITHUB_SHA}"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and release APK
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing key
        env:
          NIGHTLY_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: base64 --decode <<< "$NIGHTLY_KEYSTORE_BASE64" > "$RUNNER_TEMP/nightly.jks"

      # The alias of the key to sign with: the repository variable NIGHTLY_KEY_ALIAS
      # when it is set, otherwise the keystore's only private key. keytool reads the
      # password from the environment, so it is neither on a command line nor in the
      # log; the listing is kept out of the log too.
      - name: Resolve the key alias
        id: alias
        env:
          NIGHTLY_KEY_ALIAS: ${{ vars.NIGHTLY_KEY_ALIAS }}
          NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          alias="$NIGHTLY_KEY_ALIAS"
          if [ -z "$alias" ]; then
            if ! listing=$(keytool -list -v -keystore "$RUNNER_TEMP/nightly.jks" -storepass:env NIGHTLY_KEYSTORE_PASSWORD 2>&1); then
              echo "$listing" >&2
              echo "::error::keytool cannot read the keystore in NIGHTLY_KEYSTORE_BASE64 with NIGHTLY_KEYSTORE_PASSWORD; see \"Nightly builds\" in README.md."
              exit 1
            fi
            # keytool -list -v prints "Alias name: <alias>" followed, a few lines on, by
            # "Entry type: PrivateKeyEntry" for each key.
            mapfile -t aliases < <(awk '/^Alias name: /{ a = substr($0, 13) } /^Entry type: PrivateKeyEntry/{ print a }' <<< "$listing")
            case "${#aliases[@]}" in
              1) alias="${aliases[0]}" ;;
              0) echo "::error::The keystore in NIGHTLY_KEYSTORE_BASE64 holds no private key; see \"Nightly builds\" in README.md."
                 exit 1 ;;
              *) echo "::error::The keystore in NIGHTLY_KEYSTORE_BASE64 holds ${#aliases[@]} private keys (${aliases[*]}); set the repository variable NIGHTLY_KEY_ALIAS to the one to sign with."
                 exit 1 ;;
            esac
          fi
          echo "Signing with key alias: $alias"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      # -Pnightly signs the APK with the nightly key (see "Nightly builds" in
      # README.md). The commit and the tag go into BuildConfig and the version
      # shown on the status screen.
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -Pnightly
        env:
          NIGHTLY_KEYSTORE_FILE: ${{ runner.temp }}/nightly.jks
          NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
          NIGHTLY_KEY_ALIAS: ${{ steps.alias.outputs.alias }}
          HEALTH_DEVICES_BUILD_SHA: ${{ github.sha }}
          HEALTH_DEVICES_BUILD_TAG: ${{ needs.check.outputs.tag }}

      - name: Rename APK
        id: apk
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          out="health-devices-${tag}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-devices-${{ needs.check.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Automated nightly build of Health Devices at ${GITHUB_SHA}." \
            --prerelease \
            "${{ steps.apk.outputs.path }}"
